[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic-s2s"
version = "0.1.0"
description = "Real-time Amharic Speech-to-Speech (S2S) conversational voice pipeline built with Pipecat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai>=0.0.40",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "silero-vad>=5.1.2",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
local-audio = ["pyaudio>=0.2.14"]
dev = ["pytest>=7.0.0", "black>=24.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
